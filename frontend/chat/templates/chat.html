<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insurance AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <style>
    #messages { scroll-behavior: smooth; }
    .msg-enter { animation: fadeUp 0.25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .typing span { display:inline-block; width:7px; height:7px; border-radius:50%; background:#94a3b8; animation:bounce 1s infinite; }
    .typing span:nth-child(2){ animation-delay:.15s; } .typing span:nth-child(3){ animation-delay:.3s; }
    @keyframes bounce { 0%,80%,100%{ transform:translateY(0);} 40%{ transform:translateY(-5px);} }
    .prose-chat p { margin: 0 0 .5rem; } .prose-chat p:last-child { margin-bottom:0; }
    .prose-chat ul { list-style: disc; padding-left: 1.25rem; margin: .25rem 0 .5rem; }
    .prose-chat ol { list-style: decimal; padding-left: 1.25rem; margin: .25rem 0 .5rem; }
    .prose-chat strong { font-weight: 600; }
    .prose-chat a { color: #2563eb; text-decoration: underline; }
    .session-item:hover .del-btn { opacity: 1; }
    ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:4px; }
  </style>
</head>
<body class="h-screen flex bg-slate-50 text-slate-800 overflow-hidden">

  <!-- ── Sidebar ─────────────────────────────────────────────────────────── -->
  <aside class="w-64 shrink-0 bg-slate-900 text-slate-100 flex flex-col h-screen">
    <div class="p-3">
      <div class="flex items-center gap-2 px-2 py-2 mb-2">
        <span class="text-xl">🛡️</span>
        <span class="font-semibold">Insurance AI</span>
      </div>
      <button id="new-chat-btn"
              class="w-full flex items-center gap-2 px-3 py-2.5 rounded-lg border border-slate-700
                     hover:bg-slate-800 transition-colors text-sm font-medium">
        <span class="text-lg leading-none">+</span> New chat
      </button>
    </div>

    <div class="px-3 pb-2 text-xs uppercase tracking-wide text-slate-500">Recent</div>
    <nav id="sessions" class="flex-1 overflow-y-auto px-2 space-y-1"></nav>

    <div class="border-t border-slate-800 p-3 space-y-1">
      <a href="{% url 'profile' %}"
         class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-800 transition-colors text-sm">
        <span>👤</span> <span class="truncate">{{ name }}</span>
      </a>
      <a href="{% url 'logout' %}"
         class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-slate-800 transition-colors text-sm text-slate-400">
        <span>↩</span> Sign out
      </a>
    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────────────────────── -->
  <main class="flex-1 flex flex-col h-screen">
    <header class="bg-white border-b border-slate-200 px-5 py-3 flex items-center justify-between shadow-sm">
      <div class="flex items-center gap-2">
        <h1 id="chat-title" class="font-semibold text-slate-800">New chat</h1>
        <span id="flow-badge" class="hidden text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium"></span>
      </div>
    </header>

    <div id="messages" class="flex-1 overflow-y-auto px-4 py-6 space-y-4"></div>

    <div class="bg-white border-t border-slate-200 px-4 py-3">
      <form id="chat-form" class="flex gap-3 max-w-3xl mx-auto">
        {% csrf_token %}
        <input id="user-input" type="text" autocomplete="off"
               placeholder="Ask me anything about your insurance…"
               class="flex-1 px-4 py-3 border border-slate-300 rounded-xl text-sm
                      focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" />
        <button type="submit" id="send-btn"
                class="px-5 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300
                       text-white font-semibold rounded-xl text-sm transition-colors">Send</button>
      </form>
    </div>
  </main>

<script>
const SEND_URL     = "{% url 'send' %}";
const HISTORY_URL  = "{% url 'history' %}";
const SESSIONS_URL = "{% url 'sessions' %}";
const CSRF         = document.querySelector("[name=csrfmiddlewaretoken]").value;
let   activeSession = "{{ session_id }}";

const $messages = document.getElementById("messages");
const $form     = document.getElementById("chat-form");
const $input    = document.getElementById("user-input");
const $sendBtn  = document.getElementById("send-btn");
const $flow     = document.getElementById("flow-badge");
const $sessions = document.getElementById("sessions");
const $title    = document.getElementById("chat-title");

const WELCOME =
  "Hello! 👋 I'm your **Insurance AI assistant**.\n\n" +
  "I can help you with:\n" +
  "- 🔍 Exploring & comparing insurance policies\n" +
  "- 🛒 Purchasing a new policy\n" +
  "- 📋 Questions about your existing coverage\n" +
  "- 🔄 Renewing or upgrading a policy\n" +
  "- 🏥 Filing or checking a claim\n\n" +
  "What can I help you with today?";

// ── Rendering ──────────────────────────────────────────────────────────────
function render(text) { return DOMPurify.sanitize(marked.parse(text || "")); }
function scrollBottom() { $messages.scrollTop = $messages.scrollHeight; }

function addMessage(role, text) {
  const isUser = role === "user";
  const wrap = document.createElement("div");
  wrap.className = `flex msg-enter ${isUser ? "justify-end" : "justify-start"}`;
  const bubble = document.createElement("div");
  bubble.className = [
    "max-w-[75%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed prose-chat",
    isUser ? "bg-blue-600 text-white rounded-br-sm"
           : "bg-white text-slate-800 shadow-sm border border-slate-100 rounded-bl-sm"
  ].join(" ");
  if (isUser) { bubble.textContent = text; }
  else        { bubble.innerHTML = render(text); }
  wrap.appendChild(bubble);
  $messages.appendChild(wrap);
  scrollBottom();
}

function showTyping() {
  const w = document.createElement("div");
  w.id = "typing"; w.className = "flex justify-start msg-enter";
  w.innerHTML = `<div class="bg-white shadow-sm border border-slate-100 rounded-2xl rounded-bl-sm px-4 py-3">
      <div class="typing flex gap-1 items-center h-4"><span></span><span></span><span></span></div></div>`;
  $messages.appendChild(w); scrollBottom();
}
function hideTyping() { const e = document.getElementById("typing"); if (e) e.remove(); }

function updateFlow(flow) {
  if (!flow) { $flow.classList.add("hidden"); return; }
  const labels = { support:"Support", purchase:"Purchase", renewal:"Policy Mgmt", claim:"Claims" };
  $flow.textContent = labels[flow] || flow;
  $flow.classList.remove("hidden");
}

// ── Sessions sidebar ───────────────────────────────────────────────────────
async function loadSessions() {
  try {
    const r = await fetch(SESSIONS_URL);
    const data = await r.json();
    renderSessions(data.sessions || []);
  } catch (_) {}
}

function renderSessions(sessions) {
  $sessions.innerHTML = "";
  sessions.forEach(s => {
    const item = document.createElement("div");
    item.className = `session-item group flex items-center gap-1 px-2 py-2 rounded-lg cursor-pointer text-sm
                      ${s.session_id === activeSession ? "bg-slate-800" : "hover:bg-slate-800/60"}`;
    const label = document.createElement("span");
    label.className = "flex-1 truncate text-slate-200";
    label.textContent = s.title || "New chat";
    label.onclick = () => switchSession(s.session_id, s.title);
    const del = document.createElement("button");
    del.className = "del-btn opacity-0 transition-opacity text-slate-500 hover:text-red-400 px-1";
    del.innerHTML = "🗑";
    del.title = "Delete chat";
    del.onclick = (e) => { e.stopPropagation(); deleteSession(s.session_id); };
    item.appendChild(label); item.appendChild(del);
    $sessions.appendChild(item);
  });
}

async function switchSession(sid, title) {
  activeSession = sid;
  $title.textContent = title || "Chat";
  updateFlow(null);
  await loadHistory();
  loadSessions();   // active highlight refresh
}

async function newChat() {
  try {
    const r = await fetch(SESSIONS_URL, { method:"POST", headers:{ "X-CSRFToken":CSRF } });
    const data = await r.json();
    activeSession = data.session_id;
    $title.textContent = "New chat";
    $messages.innerHTML = ""; updateFlow(null);
    addMessage("ai", WELCOME);
    loadSessions();
  } catch (_) {}
}

async function deleteSession(sid) {
  if (!confirm("Delete this chat?")) return;
  try {
    await fetch(`/api/sessions/${sid}/delete/`, { method:"POST", headers:{ "X-CSRFToken":CSRF } });
    if (sid === activeSession) { activeSession = null; $messages.innerHTML = ""; $title.textContent = "Insurance AI"; }
    await loadSessions();
  } catch (_) {}
}

// ── History ────────────────────────────────────────────────────────────────
async function loadHistory() {
  $messages.innerHTML = "";
  try {
    const r = await fetch(`${HISTORY_URL}?session_id=${encodeURIComponent(activeSession)}`);
    const data = await r.json();
    const msgs = data.messages || [];
    if (msgs.length === 0) addMessage("ai", WELCOME);
    else msgs.forEach(m => addMessage(m.role === "user" ? "user" : "ai", m.content));
  } catch (_) { addMessage("ai", WELCOME); }
}

// ── Send ───────────────────────────────────────────────────────────────────
async function sendMessage(text) {
  addMessage("user", text);
  $input.value = ""; $sendBtn.disabled = true; showTyping();
  let isFirst = $messages.querySelectorAll(".justify-end").length === 1;
  try {
    const r = await fetch(SEND_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-CSRFToken":CSRF },
      body: JSON.stringify({ message:text, session_id:activeSession }),
    });
    hideTyping();
    const data = await r.json();
    if (data.session_id) activeSession = data.session_id;
    if (data.error) addMessage("ai", "⚠️ " + data.error);
    else { addMessage("ai", data.response); updateFlow(data.current_flow); }
    if (isFirst) loadSessions();   // pehla message bhejne pe title aa jaata hai
  } catch (_) {
    hideTyping(); addMessage("ai", "⚠️ Something went wrong. Please try again.");
  } finally { $sendBtn.disabled = false; $input.focus(); }
}

$form.addEventListener("submit", e => {
  e.preventDefault();
  const t = $input.value.trim();
  if (t) sendMessage(t);
});
document.getElementById("new-chat-btn").addEventListener("click", newChat);

// ── Init ───────────────────────────────────────────────────────────────────
(async function init() {
  await loadSessions();
  await loadHistory();
  $input.focus();
})();
</script>
</body>
</html>
