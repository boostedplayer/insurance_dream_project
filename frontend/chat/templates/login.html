<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Insurance AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center">

  <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-8">
      <div class="text-3xl mb-2">🛡️</div>
      <h1 class="text-2xl font-bold text-slate-800">Insurance AI</h1>
      <p class="text-slate-500 text-sm mt-1">Sign in to continue</p>
    </div>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{% url 'login' %}" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input
          type="email" name="email" required autofocus
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input
          type="password" name="password" required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm
                 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold
               rounded-lg text-sm transition-colors"
      >
        Sign in
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Don't have an account?
      <a href="{% url 'register' %}" class="text-blue-600 hover:underline font-medium">Register</a>
    </p>

  </div>

</body>
</html>
