version: '3.8'

services:

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: insurance_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  fastapi:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8002 --workers 2
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/insurance_database
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  django:
    build: .
    command: sh -c "cd /app/frontend && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@postgres:5432/insurance_database
      - FASTAPI_BASE_URL=http://fastapi:8002
    depends_on:
      postgres:
        condition: service_healthy
      fastapi:
        condition: service_started
    restart: always

volumes:
  postgres_data:
